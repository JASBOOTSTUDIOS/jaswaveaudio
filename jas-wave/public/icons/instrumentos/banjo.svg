<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="jaswave-instrument-icon" data-instrument-id="banjo">
  <!-- Aro metálico exterior y parche circular de banjo -->
  <circle cx="32" cy="38" r="16" fill="currentColor" fill-opacity="0.15" stroke-width="2.5" />
  <circle cx="32" cy="38" r="13" stroke-width="1.5" fill="currentColor" fill-opacity="0.1" />
  <!-- Puente de madera apoyado en el parche -->
  <rect x="27" y="44" width="10" height="2" fill="currentColor" />
  <!-- Cordal de sujeción inferior -->
  <path d="M30 53h4v3h-4z" fill="currentColor" />
  <!-- Mástil largo y fino de banjo -->
  <path d="M30 6v16h4V6z" fill="currentColor" fill-opacity="0.25" stroke-width="1.5" />
  <!-- 5ª clavija característica en el costado del mástil (5th string peg) -->
  <circle cx="27" cy="15" r="1.5" fill="currentColor" />
  <!-- Clavijero superior -->
  <path d="M29 2h6v4h-6z" stroke-width="1.5" />
  <circle cx="27" cy="3" r="1.5" fill="currentColor" />
  <circle cx="37" cy="3" r="1.5" fill="currentColor" />
</svg>
