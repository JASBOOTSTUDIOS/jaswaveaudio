<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="jaswave-instrument-icon" data-instrument-id="snare">
  <!-- Parche superior de la caja -->
  <ellipse cx="32" cy="24" rx="20" ry="7" fill="currentColor" fill-opacity="0.25" stroke-width="2.5" />
  <!-- Casco de madera o metal -->
  <path d="M12 24v16c0 3.8 9 7 20 7s20-3.2 20-7V24" fill="currentColor" fill-opacity="0.14" stroke-width="2.5" />
  <!-- Aro inferior -->
  <ellipse cx="32" cy="40" rx="20" ry="7" stroke-width="1.5" opacity="0.6" />
  <!-- Varillas de tensión y bellotas (lugs) -->
  <line x1="16" y1="26" x2="16" y2="42" stroke-width="2" />
  <line x1="24" y1="28" x2="24" y2="44" stroke-width="2" />
  <line x1="32" y1="28.5" x2="32" y2="44.5" stroke-width="2" />
  <line x1="40" y1="28" x2="40" y2="44" stroke-width="2" />
  <line x1="48" y1="26" x2="48" y2="42" stroke-width="2" />
  <!-- Mecanismo de bordonera lateral (throw-off strainer) -->
  <rect x="8" y="28" width="4" height="6" fill="currentColor" />
  <!-- Dos baquetas de madera cruzadas en acción -->
  <line x1="10" y1="12" x2="38" y2="28" stroke-width="2.5" />
  <circle cx="38" cy="28" r="1.5" fill="currentColor" />
  <line x1="54" y1="12" x2="26" y2="28" stroke-width="2.5" />
  <circle cx="26" cy="28" r="1.5" fill="currentColor" />
</svg>
