  <rect x="10" y="20" width="44" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke-width="1.5" />
  <circle cx="16" cy="24" r="2" fill="currentColor" />
  <circle cx="23" cy="24" r="2" fill="currentColor" />
  <circle cx="30" cy="24" r="2" fill="currentColor" />
  <line x1="38" y1="24" x2="50" y2="24" stroke-width="2" />
  <!-- Teclado frontal -->
  <rect x="8" y="28" width="48" height="12" rx="1" fill="currentColor" fill-opacity="0.3" stroke-width="2" />
  <!-- Teclas blancas -->
  <line x1="14" y1="28" x2="14" y2="40" stroke-width="1.5" />
  <line x1="20" y1="28" x2="20" y2="40" stroke-width="1.5" />
  <line x1="26" y1="28" x2="26" y2="40" stroke-width="1.5" />
  <line x1="32" y1="28" x2="32" y2="40" stroke-width="1.5" />
  <line x1="38" y1="28" x2="38" y2="40" stroke-width="1.5" />
  <line x1="44" y1="28" x2="44" y2="40" stroke-width="1.5" />
  <line x1="50" y1="28" x2="50" y2="40" stroke-width="1.5" />
  <!-- Teclas negras -->
  <rect x="12" y="28" width="3.5" height="7" fill="currentColor" />
  <rect x="18" y="28" width="3.5" height="7" fill="currentColor" />
  <rect x="30" y="28" width="3.5" height="7" fill="currentColor" />
  <rect x="36" y="28" width="3.5" height="7" fill="currentColor" />
  <rect x="42" y="28" width="3.5" height="7" fill="currentColor" />
  <!-- 4 Patas cromadas en ángulo -->
  <line x1="12" y1="42" x2="6" y2="56" stroke-width="2" />
  <line x1="52" y1="42" x2="58" y2="56" stroke-width="2" />
