<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" class="jaswave-instrument-icon" data-instrument-id="piano-electric">
  <!-- Chasis redondeado vintage tipo Rhodes / Wurlitzer -->
  <rect x="6" y="16" width="52" height="26" rx="4" fill="currentColor" fill-opacity="0.14" stroke-width="2" />
