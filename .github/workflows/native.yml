name: Native

# Compila los binarios nativos del instalador (plugin host + JasWave Piano + JasWave Roles).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: VST3 SDK (fijado)
        run: npm run native:sdk

      - name: Build nativo (Release x64, VS 2022)
        run: npm run native:build

      - name: Subir binarios
        uses: actions/upload-artifact@v4
        with:
          name: jaswave-native-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            native/plugin-host/build-release/Release/jaswave-plugin-host.exe
            native/plugin-host/build-release/JasWavePiano.vst3/
            native/jaswave-roles-vst/build-release/JasWaveRoles.vst3/
